name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions: read-all

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          ext=""
          [ "$GOOS" = "windows" ] && ext=".exe"
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            version="${{ github.ref_name }}"
          else
            short_sha="${{ github.sha }}"
            version="${short_sha:0:7}"
          fi
          go build \
            -ldflags="-X 'github.com/AndrewADev/bight/cmd.ldVersion=${version}'" \
            -o "bight-${GOOS}-${GOARCH}${ext}" .

      - uses: actions/upload-artifact@v7
        with:
          name: bight-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bight-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          cd dist
          sha256sum * > checksums.txt

      - name: Extract release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          awk -v tag="$TAG" '
            $0 ~ "^## " tag " " {found=1; next}
            found && /^## / {exit}
            found {print}
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for $TAG; update the changelog before tagging." >&2
            exit 1
          fi

      - name: Publish semver release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$REPO" \
            --title "$TAG" \
            --notes-file release-notes.md

  update-tap:
    name: Update Homebrew tap
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: AndrewADev/homebrew-tap/.github/workflows/update-formula.yml@main
    with:
      version: ${{ github.ref_name }}
    secrets:
      tap_token: ${{ secrets.TAP_GITHUB_TOKEN }}
