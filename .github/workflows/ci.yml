name: CI

on:
  pull_request:

jobs:
  check:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Format
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Build
        run: go build ./...

      - name: Command docs up-to-date
        run: |
          go generate ./...
          if [ -n "$(git status --porcelain -- docs/commands)" ]; then
            echo "::error::Command docs in docs/commands/ are out of date. Run 'go generate ./...' and commit the result."
            git status --short -- docs/commands
            git diff -- docs/commands
            exit 1
          fi

  commits:
    name: Commit messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          go install github.com/siderolabs/conform/cmd/conform@latest
          git log --format='%H' "${BASE}".."${HEAD}" | while read sha; do
            git log -1 --format='%B' "$sha" > /tmp/msg.txt
            conform enforce --commit-msg-file /tmp/msg.txt
          done
