name: Pages

on:
  push:
    branches:
      - main
    paths:
      - README.md
      - CHANGELOG.md
      - DEVELOPING.md
      - docs/**
      - tools/build-site.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: read-all

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Install pandoc
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends pandoc

      - name: Build site
        run: tools/build-site.sh dist/site

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

      - id: deploy
        uses: actions/deploy-pages@v5
